version: "3.9"

# Credentials are read from a .env file (docker compose auto-loads it).
# See .env.example for the template. Never commit the real .env.
# In production, set POSTGRES_PASSWORD to a strong value in .env.
services:
  db:
    image: postgres:16-alpine
    container_name: clarityai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clarityai_db}
      POSTGRES_USER: ${POSTGRES_USER:-clarityai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-clarityai} -d $${POSTGRES_DB:-clarityai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clarityai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clarityai}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-clarityai_db}
      APP_ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: clarityai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data: